<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>سامانه پیام اس ام اس</title>

  <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/dist/font-face.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: Vazirmatn, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #0ea5e9, #020617 60%);
      color: white;
    }

    .card {
      width: 440px;
      background: rgba(2, 6, 23, 0.95);
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(56,189,248,0.25), transparent 40%);
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      text-align: center;
      font-weight: 600;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      opacity: 0.6;
      margin-top: 6px;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      margin-top: 14px;
      font-size: 14px;
      opacity: 0.85;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(15, 23, 42, 0.9);
      color: white;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56,189,248,0.25);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: white;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 35px rgba(14,165,233,0.35);
    }

    pre {
      margin-top: 18px;
      background: rgba(15, 23, 42, 0.9);
      padding: 12px;
      border-radius: 12px;
      font-size: 12px;
      max-height: 150px;
      overflow: auto;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .brand {
      text-align: center;
      margin-bottom: 10px;
      font-size: 12px;
      opacity: 0.45;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="glow"></div>

    <div class="brand">Samaneh Payam SMS</div>
    <h1>سامانه پیام اس ام اس</h1>
    <div class="subtitle">ارسال پیامک آزمایشی</div>

    <label>شماره گیرنده</label>
    <input type="text" id="to" placeholder="09123456789">

    <label>متن پیام</label>
    <input type="text" id="text" placeholder="متن پیام شما">

    <button onclick="sendSMS()">ارسال پیامک</button>

    <pre id="result">پاسخ سرور اینجا نمایش داده می شود</pre>
  </div>

  <script>
    async function sendSMS() {
      const url = "https://www.payamsms.com/api/sms/send";

      const payload = {
        username: "YOUR_USERNAME",
        password: "YOUR_PASSWORD",
        from: "YOUR_LINE_NUMBER",
        to: document.getElementById("to").value,
        text: document.getElementById("text").value
      };

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        document.getElementById("result").textContent =
          JSON.stringify(data, null, 2);

      } catch (err) {
        document.getElementById("result").textContent = err.toString();
      }
    }
  </script>

</body>
</html>
